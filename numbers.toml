# Provenance manifest — every number this deck asserts, and where it came from.
#
# Checked by `scripts/_source_checks.py` (Tier S). Each entry re-reads its source, so when a table
# is regenerated a rounding-compatible change still passes and a real change fails loudly.
#
# Three kinds of entry:
#   row + col   — a cell in a CSV under sources/tables/: matched on the first column, then the
#                 named header.
#   frozen      — a key into sources/claims.toml, the frozen snapshot of the numbers the paper
#                 states in PROSE and no table exposes as a cell. The `pattern` is kept beside it
#                 and is used only when `--root <a project2026e checkout>` is given, to re-verify
#                 against the live manuscript.
#   derived     — computed by a deck figure script and NOT quoted in the manuscript; the entry
#                 names the generating script so a reader can re-derive it.
#
# REBUILT FROM SCRATCH 2026-07-28, and it had to be. The previous manifest carried committed
# merge-conflict markers (so this checker could not even parse it) and 8 of its 12 `index.qmd`
# regexes no longer matched — the manuscript's prose had moved on. Sourcing preference is:
#
#   prefer a `tables/*.csv` CELL over a manuscript regex wherever a cell exists.
#
# A cell survives a prose edit; a regex does not. Every `frozen` entry below is one the tables
# genuinely cannot supply.
#
# WHY `frozen` RATHER THAN A LIVE REGEX (changed 2026-07-30). This deck is portable: its folder is
# meant to be copied into a repository of its own and handed to collaborators, so the manuscript
# is not next to it and its text deliberately does not ship. sources/claims.toml records each of
# those fifteen numbers as a value, the line it was found on, and the sha256 of that line — enough
# to fail loudly if the number changes, without carrying the paper. Regenerate it with:
#
#   uv run python scripts/_sync_check.py . --root /path/to/project2026e --freeze-claims
#
# `round` is the precision the SLIDE shows. It assumes the source carries MORE precision than the
# slide (0.721 -> 0.72), and that assumption is false for a source that is itself already rounded.
# Re-rounding an already-rounded cell can disagree with rounding the full-precision value once, and
# this checker will certify the version that contradicts the figure. Two values in this deck hit
# that: see the CLIMATE ACTION and SIMPLE-MEAN notes below.
#
# TOKENS, NOT VALUES. Pass 2 matches the bare digits a slide prints, so a NEGATIVE number is
# scanned as its positive token: the slide's "-0.05" is looked up as "0.05". Such entries are
# sourced by regex with the sign left OUTSIDE the capture group.
#
# COLLISIONS ARE DECLARED SEPARATELY. Where two unrelated quantities round to the same token
# (0.63, 0.64, 0.50, 0.44, 0.46, 64, 75, 77, 80, 91, 0.28), each gets its own entry, so a change in
# either one is caught independently rather than masked by its twin.

[meta]
ignore = []

